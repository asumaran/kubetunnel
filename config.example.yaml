# kubetunnel — example configuration.
#
# Paths support `~` expansion. Install with:
#   mkdir -p ~/.config/kubetunnel
#   cp config.example.yaml ~/.config/kubetunnel/config.yaml

tls:
  cert_dir: ~/.local/share/kubetunnel/certs
  listen_addr: "127.0.0.1:443"

control:
  socket: /var/run/kubetunnel.sock

logging:
  dir: ~/Library/Logs/kubetunnel
  max_size_mb: 10
  max_files: 5
  max_age_days: 30
  compress: true

access_log:
  enabled: true

# When the daemon runs under launchd (as root) it inherits a minimal PATH and
# will not see tools installed under your user profile, e.g. the gcloud SDK
# auth plugins. Prepend any extra directories kubectl needs here. These are
# passed to every kubectl subprocess.
environment:
  path_additions:
    - /usr/local/share/google-cloud-sdk/bin
    - /opt/homebrew/share/google-cloud-sdk/bin
  extra:
    USE_GKE_GCLOUD_AUTH_PLUGIN: "True"

tunnels:
  - name: api
    hostname: api.staging.internal.example.com
    kube_context: gke_my-project_us-central1_staging
    namespace: staging
    target: svc/api-gateway
    remote_port: 80
    local_port: 19001
    # No health_check: a generic probe would hit an endpoint the app does not
    # implement and get killed in a loop. Add one only when the target has a
    # dedicated /healthz route.
    #
    # Optional: strip a leading path prefix before forwarding, to replay an
    # Istio VirtualService rewrite that `kubectl port-forward` bypasses.
    # strip_prefix: /api

  - name: web-a
    hostname: web-a.staging.internal.example.com
    kube_context: gke_my-project_us-central1_staging
    namespace: staging
    target: svc/web-frontend-a
    remote_port: 80
    local_port: 19002
    health_check:
      path: /api/health
      interval: 30s

  - name: web-b
    hostname: web-b.staging.internal.example.com
    kube_context: gke_my-project_us-central1_staging
    namespace: staging
    target: svc/web-frontend-b
    remote_port: 80
    local_port: 19003
    health_check:
      path: /api/health
      interval: 30s

  # One public host, many services: an Istio VirtualService per path prefix
  # fans "gateway.staging.internal.example.com" out to several backends.
  # kubetunnel replays that with one tunnel per prefix on the same hostname;
  # the longest matching prefix wins. A tunnel without path_prefix would be
  # the catch-all for the host. Each entry keeps its own kubectl port-forward,
  # so only the services you actually consume need to be listed.
  # - name: gateway-contentful
  #   hostname: gateway.staging.internal.example.com
  #   kube_context: gke_my-project_europe-west1_staging
  #   namespace: staging
  #   target: svc/contentful-api
  #   remote_port: 80
  #   local_port: 9101
  #   path_prefix: /contentful
  #   strip_prefix: /contentful   # replay the VirtualService rewrite to "/"
  # - name: gateway-stores
  #   hostname: gateway.staging.internal.example.com
  #   kube_context: gke_my-project_europe-west1_staging
  #   namespace: staging
  #   target: svc/stores
  #   remote_port: 80
  #   local_port: 9102
  #   path_prefix: /stores
  #   strip_prefix: /stores
